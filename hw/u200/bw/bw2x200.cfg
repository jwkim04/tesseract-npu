# hw/u200/bw/bw2x200.cfg — v++ link configuration of two compute units of the bandwidth kernel tsr_bw_k4
# (docs/bandwidth-kernel.md §4) in one xclbin, at a 200 MHz kernel clock: every DDR4 bank gets two AXI read
# ports, one from each compute unit. It measures whether two 200 MHz ports on one bank together deliver the
# bank's bandwidth (about 18 GB/s) where one port is limited to 64 B x 200 MHz = 12.8 GB/s. Build:
#   TSR_BW_CFG=hw/u200/bw/bw2x200.cfg TSR_BW_OUT=build/u200/bw2x200 hw/u200/bw/build_bw_xclbin.sh
# Measure with hw/u200/bw/measure_bw2.sh. Compute units `tsr_bw_a` and `tsr_bw_b`, both with
# m_axi_ch<c> -> DDR[c]. Like bw.cfg: no `slr=`, no floorplan.
kernel_frequency=200

[connectivity]
nk=tsr_bw_k4:2:tsr_bw_a.tsr_bw_b
sp=tsr_bw_a.m_axi_ch0:DDR[0]
sp=tsr_bw_a.m_axi_ch1:DDR[1]
sp=tsr_bw_a.m_axi_ch2:DDR[2]
sp=tsr_bw_a.m_axi_ch3:DDR[3]
sp=tsr_bw_b.m_axi_ch0:DDR[0]
sp=tsr_bw_b.m_axi_ch1:DDR[1]
sp=tsr_bw_b.m_axi_ch2:DDR[2]
sp=tsr_bw_b.m_axi_ch3:DDR[3]

[vivado]
# the dev server: 16 cores, 14 GB RAM and a large swap
synth.jobs=8
impl.jobs=8
param=general.maxThreads=8
# a kernel clock that is not the platform's 300 MHz needs the clock calculator hook of the Tesseract kernels
# (docs/platform-u200.md §8.3); without it the implementation is constrained to 100 MHz. The path is relative
# to the link's output directory, three levels below the repository
prop=run.impl_1.STEPS.INIT_DESIGN.TCL.PRE=../../../hw/u200/clock_vitis_compat.tcl
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
