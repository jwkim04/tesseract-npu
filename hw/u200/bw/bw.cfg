# hw/u200/bw/bw.cfg — v++ link configuration of the DMA bandwidth kernel tsr_bw_k4 (docs/bandwidth-kernel.md
# §4) for xilinx_u200_gen3x16_xdma_2_202110_1. Used by hw/u200/bw/build_bw_xclbin.sh. The link applies
# no floorplan (docs/bandwidth-kernel.md §4.1).
#
# Kernel clock: 300 MHz (F_CORE, the clock the Tesseract kernels run at, so the measured numbers
# are the ones the core will see; the measured clock is read back from the xclbin by tsr_bw).
# One compute unit `tsr_bw`; m_axi_ch<c> -> DDR[c], the binding of tsr_u200_k4 (hw/u200/k4.cfg).
# The compute unit spans the SLRs of the four banks (platforminfo: DDR[0] SLR0, DDR[1] SLR1, DDR[2]
# SLR1, DDR[3] SLR2): no `slr=`; TSR_BW_FLOORPLAN=1 adds the
# draft hw/u200/bw/bw_floorplan.tcl (engine + bridge of channel c into the SLR of DDR[c]; not used
# for the xclbin and not needed for timing). Every
# path between the control block and a channel is registered on both sides (CTRL_PIPE 2 toggle
# stages, static configuration snapshot, registered result path) and every AXI channel has
# AXI_SLICES 2 register slices.
kernel_frequency=300

[connectivity]
nk=tsr_bw_k4:1:tsr_bw
sp=tsr_bw.m_axi_ch0:DDR[0]
sp=tsr_bw.m_axi_ch1:DDR[1]
sp=tsr_bw.m_axi_ch2:DDR[2]
sp=tsr_bw.m_axi_ch3:DDR[3]

[vivado]
# the dev server: 16 cores, 14 GB RAM (a U200 implementation may need 32 GB or more)
synth.jobs=4
impl.jobs=4
param=general.maxThreads=4
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
