# hw/u200/k4.cfg — v++ link configuration of tsr_u200_k4 (4 channels, T_MAX 8: the target)
# for xilinx_u200_gen3x16_xdma_2_202110_1. Used by hw/u200/build_xclbin.sh (docs/platform-u200.md
# §8). The core with the control core, the issue path, the vector unit (16 / 8 lanes behind 2 pipe stages on
# each side, in SLR0), the attention modes and the DB block (gate T3, CC §14.3). The last link of the kernel
# without them: 2026-10-25, 3 h 51 min (§8.2).
#
# U200 uses scalable clocks: kernel_frequency selects IDs 0 / 1 at 300 / 166.7 MHz.
# clock.id selects fixed reference clocks and cannot select these scalable clocks (CC §11.1).
# One compute unit `tsr_k4`; m_axi_ch<c> -> DDR[c] (spec: cluster c streams
# only from channel c; ch0 also carries CMD / IO / AUX). DDR bank SLRs (platforminfo of the
# platform, 2026-10-23): DDR[0] SLR0, DDR[1] and DDR[2] SLR1, DDR[3] SLR2.
# The kernel spans all three SLRs, so no `slr=` (one `slr=` would confine the compute unit to one
# SLR). Placement: floorplan C'' (docs/design/04-control-core.md §14.2), hw/u200/k4_floorplan.tcl as the
# place_design pre-hook (after opt_design; v++ sources it after its own and the platform's hooks):
# clusters 0 / 2 with their assemblers and the 16 VU lanes in pblock_dynamic_SLR0, clusters 1 / 3 in
# pblock_dynamic_SLR2, the rest of the core (the control core in its sub-pblock pblock_tsr_ctrl_rv), the
# arbiters and the adapter in pblock_dynamic_SLR1, the first / last stage of every crossing pipe pinned,
# bridges 0 / 3 crossing in their AXI slices.
# v++ resolves the hook path against its working directory: build_xclbin.sh links in
# build/u200/k4 (or build/u200/k4_hw_emu, or a TSR_U200_OUT such as build/link/k4), three levels below the repository root; run v++ from a
# directory at that depth, or pass an absolute path. Placer directive AltSpreadLogic_high and
# post-route phys_opt as in the out-of-context runs that met 300 MHz (docs/rtl-m3.md §14.1).
# Every SLR crossing inside the kernel is registered on both sides: AXI_SLICES 2 per AXI channel,
# MVM_BC_PIPE / MVM_RES_PIPE 2 on the broadcast, result, weight-stream and gather pipes, VU_LANE_PIPE 2
# around the VU lanes.
kernel_frequency=0:300|1:166.666667

[advanced]
param=compiler.userPostSysLinkOverlayTcl=../../../hw/u200/clock_bd_check.tcl

[connectivity]
nk=tsr_u200_k4:1:tsr_k4
sp=tsr_k4.m_axi_ch0:DDR[0]
sp=tsr_k4.m_axi_ch1:DDR[1]
sp=tsr_k4.m_axi_ch2:DDR[2]
sp=tsr_k4.m_axi_ch3:DDR[3]

[vivado]
# the dev server: 16 cores, 14 GB RAM (the out-of-context k4 implementation alone peaked at 13.5 GB; swap)
synth.jobs=8
impl.jobs=8
param=general.maxThreads=8
# Correct the Vitis 2024.2 clock-calculator API before its INIT.POST override.
prop=run.impl_1.STEPS.INIT_DESIGN.TCL.PRE=../../../hw/u200/clock_vitis_compat.tcl
prop=run.impl_1.STEPS.PLACE_DESIGN.TCL.PRE=../../../hw/u200/k4_floorplan.tcl
prop=run.impl_1.STEPS.PLACE_DESIGN.TCL.POST=../../../hw/u200/k4_locality_check.tcl
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=AltSpreadLogic_high
# no BRAM power optimisation on the control core's TCMs (gate T1, CC §14.3); relative like the other hooks
prop=run.impl_1.STEPS.OPT_DESIGN.TCL.PRE=../../../hw/u200/impl_pre.tcl
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.TCL.POST=../../../hw/u200/k4_locality_check.tcl
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.TCL.POST=../../../hw/u200/k4_locality_check.tcl
# the CDC gate (CC §11.3, T3): fails the implementation run when ap_clk <-> ap_clk_2 is not covered by the
# kernel's packaged constraints (TSR_CDC_GATE=warn only reports); the path is relative like the floorplan hook's
prop=run.impl_1.STEPS.ROUTE_DESIGN.TCL.POST=../../../hw/u200/cdc_check.tcl
# Vitis appends the user hook after its frequency-scaling pre-bitstream hook.
prop=run.impl_1.STEPS.WRITE_BITSTREAM.TCL.PRE=../../../hw/u200/clock_final_check.tcl
