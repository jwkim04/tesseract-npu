# hw/u200/k4.cfg — v++ link configuration of tsr_u200_k4 (4 channels, T_MAX 8): the reduced first card image
# for xilinx_u200_gen3x16_xdma_2_202110_1. Used by hw/u200/build_xclbin.sh (docs/platform-u200.md §8, §8.7).
# Four MVM clusters, the RISC-V control core in SLR0 behind the narrow RV transport, the issue path, the CSR
# block, the 2R2W SPM, DMA without KVST, QACT and the DB block without trace writer and history. No vector unit
# and no attention: CAPS reads 0, so the host leaves every kind but MUL_MAT to the CPU (M6). The routed
# 2026-10-25 image (§8.2) had the same cluster configuration without the control core.
#
# Clocks: this image runs the core at 200 MHz and clk_rv at 100 MHz (user decision, 2026-11-06). The first link
# of the image at 250 / 166.7 MHz routed legally and missed timing (core WNS -2.557 ns at 4.0 ns, clk_rv -0.795 ns
# at 6.0 ns). The 200 / 150 MHz link met the core and every shell clock and missed clk_rv by under 0.05 ns on the
# Ibex fetch path, so clk_rv went to 100 MHz and the core stays at 200 (§8.7). The 100 MHz image reuses the routed
# 200 / 150 MHz result (TSR_VPP_REUSE_IMPL in build_xclbin.sh) and has no new place and route.
# hw/u200/clock_final_check.tcl accepts exactly these two clocks for k4.
# U200 uses scalable clocks: kernel_frequency selects IDs 0 / 1 (core / RV).
# clock.id selects fixed reference clocks and cannot select these scalable clocks (CC §11.1).
# One compute unit `tsr_k4`; m_axi_ch<c> -> DDR[c] (spec: cluster c streams
# only from channel c; ch0 also carries CMD / IO / AUX). DDR bank SLRs (platforminfo of the
# platform, 2026-10-23): DDR[0] SLR0, DDR[1] and DDR[2] SLR1, DDR[3] SLR2.
# The kernel spans all three SLRs, so no `slr=` (one `slr=` would confine the compute unit to one
# SLR). Placement uses hw/u200/k4_major_blocks.tcl before place_design:
# clusters and result assemblers 0/2 and the DDR0 bridge in SLR0, 1/3 and the DDR3 bridge in SLR2.
# The control plane (the control core with its TCMs, local debug and CDC, the issue path, the CSR block and the
# DB core side) has its own Pblock inside the SLR0 platform Pblock: the top two clock-region rows of SLR0
# without the DDR0 controller regions X2Y1 to X2Y3, so it sits at the SLR1 boundary and off the DDR0 MIG.
# The three narrow control links carry segmented SPM responses, issue entries and LCQ requests; the SPM link
# ends in SLR1. SPM, DMA, QACT and the memory arbiters use SLR1.
# Central gather and individual stages remain free. No placer directive or custom post-placement
# ownership gate is selected.
# Hook paths are relative to build/u200/k4; build_xclbin.sh makes them absolute.
kernel_frequency=0:200|1:100

[advanced]
param=compiler.userPostSysLinkOverlayTcl=../../../hw/u200/clock_bd_check.tcl

[connectivity]
nk=tsr_u200_k4:1:tsr_k4
sp=tsr_k4.m_axi_ch0:DDR[0]
sp=tsr_k4.m_axi_ch1:DDR[1]
sp=tsr_k4.m_axi_ch2:DDR[2]
sp=tsr_k4.m_axi_ch3:DDR[3]

[vivado]
# the dev server: 16 cores, 14 GB RAM (the out-of-context k4 implementation alone peaked at 13.5 GB; swap)
synth.jobs=8
impl.jobs=8
param=general.maxThreads=8
# Correct the Vitis 2024.2 clock-calculator API before its INIT.POST override.
prop=run.impl_1.STEPS.INIT_DESIGN.TCL.PRE=../../../hw/u200/clock_vitis_compat.tcl
prop=run.impl_1.STEPS.PLACE_DESIGN.TCL.PRE=../../../hw/u200/k4_major_blocks.tcl
# no BRAM power optimisation on the control core's TCMs (gate T1, CC §14.3); relative like the other hooks
prop=run.impl_1.STEPS.OPT_DESIGN.TCL.PRE=../../../hw/u200/impl_pre.tcl
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
# Restore effective CDC constraints independently of placement.
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.TCL.PRE=../../../hw/u200/cdc_pre_physopt.tcl
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
# the CDC gate (CC §11.3, T3): fails the implementation run when ap_clk <-> ap_clk_2 is not covered by the
# kernel's packaged constraints (TSR_CDC_GATE=warn only reports); the path is relative like the floorplan hook's
prop=run.impl_1.STEPS.ROUTE_DESIGN.TCL.PRE=../../../hw/u200/cdc_pre_route.tcl
prop=run.impl_1.STEPS.ROUTE_DESIGN.TCL.POST=../../../hw/u200/cdc_check.tcl
# Vitis appends the user hook after its frequency-scaling pre-bitstream hook.
prop=run.impl_1.STEPS.WRITE_BITSTREAM.TCL.PRE=../../../hw/u200/clock_final_check.tcl
