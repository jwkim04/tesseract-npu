# hw/u200/k4.cfg — v++ link configuration of tsr_u200_k4 (4 channels, T_MAX 4): the full-feature card image
# for xilinx_u200_gen3x16_xdma_2_202110_1. Used by hw/u200/build_xclbin.sh (docs/platform-u200.md §8, §8.8).
# Four MVM clusters with attention, the vector unit (8 / 8 / 4 lanes), KVST with masked metadata writes, the
# paired two-flit gather, DDR0 / DDR3 local arbitration, the RISC-V control core in SLR0 behind the narrow RV
# transport, the issue path, the CSR block, the 2R2W SPM, DMA, QACT and the DB block with trace writer and
# dispatch history. No local-intermediate bank: CAPS reads 0x121 (VU, ATT, GDN: the fused Gated DeltaNet op
# in the VU, HAS_GDN 1; the image without it read 0x21). The reduced first card image of
# branch k4m200 (no VU, no attention, T_MAX 8) ran on the card at the same clocks (§8.7).
#
# Clocks: the request is the core at 250 MHz and clk_rv at 100 MHz, the highest core clock the routed design meets
# (user decision, 2026-11-09). The reduced image ran at 200 / 100 MHz (user decision, 2026-11-06). Its first link at
# 250 / 166.7 MHz routed legally and missed timing (core WNS -2.557 ns at 4.0 ns, clk_rv -0.795 ns at 6.0 ns). Its
# 200 / 150 MHz link met the core and every shell clock and missed clk_rv by under 0.05 ns on the Ibex fetch path, so
# clk_rv went to 100 MHz (§8.7). The 100 MHz reduced image reused the routed 200 / 150 MHz result (TSR_VPP_REUSE_IMPL in
# build_xclbin.sh); the full-feature image has had full place and route links at 200 / 100 MHz.
# Vitis scales the core clock down when the routed design misses the request: its pre-bitstream hook writes the scaled
# clocks to _new_clk_freq in the implementation run directory. Here the core may end anywhere from 200 to 250 MHz.
# hw/u200/clock_final_check.tcl accepts for k4 a core clock from 200.0 MHz (the floor, the validated core clock of the
# K4 images; the request itself when that is below 200) up to the request plus 0.1 MHz, and exactly the RV request (plus
# 0.1 MHz). A core clock scaled below 200 MHz, or a scaled clk_rv, fails the run.
# The K4 top has FAST_CLK 1 (docs/platform-u200.md §8.10: the stages for a 4.0 ns core clock, measured out of context at 3.5 ns).
# The first combined link at 250 / 100 MHz (2026-11-09) placed with WNS -0.347 ns after phys_opt_design (SLR CLB 84 / 88 / 89 %)
# and was stopped before routing, as agreed beforehand. A fixed 200 MHz core is `0:200|1:100`.
# U200 uses scalable clocks: kernel_frequency selects IDs 0 / 1 (core / RV).
# clock.id selects fixed reference clocks and cannot select these scalable clocks (CC §11.1).
# One compute unit `tsr_k4`; m_axi_ch<c> -> DDR[c] (spec: cluster c streams
# only from channel c; ch0 also carries CMD / IO / AUX). DDR bank SLRs (platforminfo of the
# platform, 2026-10-23): DDR[0] SLR0, DDR[1] and DDR[2] SLR1, DDR[3] SLR2.
# The kernel spans all three SLRs, so no `slr=` (one `slr=` would confine the compute unit to one
# SLR). Placement uses hw/u200/k4_major_blocks.tcl before place_design:
# clusters, result assemblers and pair sources 0/2 and the DDR0 bridge and arbiter in SLR0, 1/3 and the DDR3
# bridge and arbiter in SLR2.
# The control plane (the control core with its TCMs, local debug and CDC, the issue path with its two checker
# classes, the CSR block and the DB core side) has its own Pblock inside the SLR0 platform Pblock: the top two
# clock-region rows of SLR0 without the DDR0 controller regions X2Y1 to X2Y3, so it sits at the SLR1 boundary
# and off the DDR0 MIG. The whole vector unit has its own Pblock inside the SLR2 platform Pblock: X0Y10 to X2Y14,
# next to the SPM and off the DDR3 controller regions. The three narrow control links carry
# segmented SPM responses, issue entries and LCQ requests; the SPM link ends in SLR1. SPM, DMA with KVST, QACT and
# the arbiters of channels 1 and 2 use SLR1.
# Central gather receiver and individual stages remain free. No placer directive or custom post-placement
# ownership gate is selected.
# Hook paths are relative to build/u200/k4; build_xclbin.sh makes them absolute.
kernel_frequency=0:250|1:100

[advanced]
param=compiler.userPostSysLinkOverlayTcl=../../../hw/u200/clock_bd_check.tcl

[connectivity]
nk=tsr_u200_k4:1:tsr_k4
sp=tsr_k4.m_axi_ch0:DDR[0]
sp=tsr_k4.m_axi_ch1:DDR[1]
sp=tsr_k4.m_axi_ch2:DDR[2]
sp=tsr_k4.m_axi_ch3:DDR[3]

[vivado]
# the dev server: 16 cores, 14 GB RAM (the out-of-context k4 implementation alone peaked at 13.5 GB; swap)
synth.jobs=8
impl.jobs=8
param=general.maxThreads=8
# Correct the Vitis 2024.2 clock-calculator API before its INIT.POST override.
prop=run.impl_1.STEPS.INIT_DESIGN.TCL.PRE=../../../hw/u200/clock_vitis_compat.tcl
prop=run.impl_1.STEPS.PLACE_DESIGN.TCL.PRE=../../../hw/u200/k4_major_blocks.tcl
# no BRAM power optimisation on the control core's TCMs (gate T1, CC §14.3); relative like the other hooks
prop=run.impl_1.STEPS.OPT_DESIGN.TCL.PRE=../../../hw/u200/impl_pre.tcl
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
# Restore effective CDC constraints independently of placement.
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.TCL.PRE=../../../hw/u200/cdc_pre_physopt.tcl
# The post-place phys_opt with AggressiveExplore, for the local high-fanout paths the third full link left: the
# ready flop of tsr_mvm_front's u_p into its ~1,200 main / skid registers (-0.148 ns), the VU to the SPM (-0.107 ns)
# and the CSR read mux (-0.081 ns).
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
# Route and post-route phys_opt with AggressiveExplore. The first full link (default directives) routed legally
# and missed the shell's dma_ip_axi_aclk (250 MHz) by 0.171 ns and the core by 0.064 ns. Re-routing its checkpoint
# with AggressiveExplore brought the worst slack to -0.066 ns and TNS from -57.6 to -0.16 ns (§8.8).
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
# the CDC gate (CC §11.3, T3): fails the implementation run when ap_clk <-> ap_clk_2 is not covered by the
# kernel's packaged constraints (TSR_CDC_GATE=warn only reports); the path is relative like the floorplan hook's
prop=run.impl_1.STEPS.ROUTE_DESIGN.TCL.PRE=../../../hw/u200/cdc_pre_route.tcl
prop=run.impl_1.STEPS.ROUTE_DESIGN.TCL.POST=../../../hw/u200/cdc_check.tcl
# Vitis appends the user hook after its frequency-scaling pre-bitstream hook.
prop=run.impl_1.STEPS.WRITE_BITSTREAM.TCL.PRE=../../../hw/u200/clock_final_check.tcl
