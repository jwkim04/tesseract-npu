# hw/u200/k1.cfg — v++ link configuration of tsr_u200_k1 (1-channel bring-up bitstream, M3 gate:
# Qwen2.5-0.5B Q8_0 on hardware) for xilinx_u200_gen3x16_xdma_2_202110_1.
# Used by hw/u200/build_xclbin.sh (docs/platform-u200.md §8). Linked 2026-10-24 (hw: 57 min, WNS
# +0.011 ns, 300 MHz kept, all in SLR1; hw_emu: docs/xrt-host.md §9; docs/platform-u200.md §8.2).
#
# Kernel clock: 300 MHz (F_CORE; the platform's default kernel clock is also 300 MHz).
# One compute unit `tsr_k1` in SLR1 (pblock_dynamic_SLR1: CLOCKREGION_X0Y5:X2Y9, the dynamic part
# of the shell's SLR), its only memory port on DDR[1]. DDR bank SLRs (platforminfo of the platform,
# 2026-10-23): DDR[0] SLR0, DDR[1] and DDR[2] SLR1, DDR[3] SLR2.
kernel_frequency=300

[connectivity]
nk=tsr_u200_k1:1:tsr_k1
sp=tsr_k1.m_axi_ch0:DDR[1]
slr=tsr_k1:SLR1

[vivado]
# the dev server: 16 cores, 14 GB RAM (a U200 implementation may need 32 GB or more)
synth.jobs=4
impl.jobs=4
param=general.maxThreads=4
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
