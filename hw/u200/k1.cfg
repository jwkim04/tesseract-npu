# hw/u200/k1.cfg — v++ link configuration of tsr_u200_k1 (1-channel bring-up bitstream)
# for xilinx_u200_gen3x16_xdma_2_202110_1.
# Used by hw/u200/build_xclbin.sh (docs/platform-u200.md §8). The core with the control core, the issue path,
# the vector unit (8 / 4 lanes, no lane pipe), the attention modes and the DB block, all in SLR1 (CC §14.3;
# hw_emu: docs/xrt-host.md §9; docs/platform-u200.md §8.2).
#
# Kernel clocks: ap_clk 300 MHz (F_CORE; the platform's default kernel clock is also
# 300 MHz) and ap_clk_2 166.7 MHz (the control core's clk_rv, CC §11.1; EX §9: the kernel has the
# second clock / reset pair ap_clk_2 / ap_rst_n_2).
# kernel_frequency selects scalable clock IDs 0 / 1; clock.id is for fixed reference clocks.
# One compute unit `tsr_k1` in SLR1 (pblock_dynamic_SLR1: CLOCKREGION_X0Y5:X2Y9, the dynamic part
# of the shell's SLR), its only memory port on DDR[1]. DDR bank SLRs (platforminfo of the platform):
# DDR[0] SLR0, DDR[1] and DDR[2] SLR1, DDR[3] SLR2.
kernel_frequency=0:300|1:166.666667

[advanced]
param=compiler.userPostSysLinkOverlayTcl=../../../hw/u200/clock_bd_check.tcl

[connectivity]
nk=tsr_u200_k1:1:tsr_k1
sp=tsr_k1.m_axi_ch0:DDR[1]
slr=tsr_k1:SLR1

[vivado]
# the dev server: 16 cores, 14 GB RAM (a U200 implementation may need 32 GB or more; swap)
synth.jobs=8
impl.jobs=8
param=general.maxThreads=8
# Correct the Vitis 2024.2 clock-calculator API before its INIT.POST override.
prop=run.impl_1.STEPS.INIT_DESIGN.TCL.PRE=../../../hw/u200/clock_vitis_compat.tcl
# no BRAM power optimisation on the control core's TCMs (gate T1, CC §14.3); relative like the other hooks
prop=run.impl_1.STEPS.OPT_DESIGN.TCL.PRE=../../../hw/u200/impl_pre.tcl
# the core with the control core, the VU and the DB block is 170 K LUT in the 199,680 sites of pblock_dynamic_SLR1
# (synthesis): the first link (default placer) was at WNS -3.5 ns after placement with routing congestion level 7;
# the placer spreads the logic, as for k4
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=AltSpreadLogic_high
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
# the CDC gate (CC §11.3, T3): fails the implementation run when ap_clk <-> ap_clk_2 is not covered by the
# kernel's packaged constraints (TSR_CDC_GATE=warn only reports); the path is relative like the floorplan hook's
prop=run.impl_1.STEPS.ROUTE_DESIGN.TCL.PRE=../../../hw/u200/cdc_pre_route.tcl
prop=run.impl_1.STEPS.ROUTE_DESIGN.TCL.POST=../../../hw/u200/cdc_check.tcl
# Vitis appends the user hook after its frequency-scaling pre-bitstream hook.
prop=run.impl_1.STEPS.WRITE_BITSTREAM.TCL.PRE=../../../hw/u200/clock_final_check.tcl
