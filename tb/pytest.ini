[pytest]
# Run from anywhere: `python3 -m pytest tb` (or tb/run_all.sh). rootdir = tb/.
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -ra
# keep the source tree clean (build/ is ignored by git)
cache_dir = ../build/pytest_cache
markers =
    slow: long-running simulation (deselect with -m "not slow")
    traces: replays trace directories on the RTL
